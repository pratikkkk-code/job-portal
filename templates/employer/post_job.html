{% extends "base.html" %}
{% block title %}Post a Job – JobConnect{% endblock %}

{% block content %}
<div class="container py-5" style="max-width:720px;">
  <h2 class="fw-800 mb-1" style="font-family:'Sora',sans-serif;"><i class="bi bi-plus-circle text-primary me-2"></i>Post a New Job</h2>
  <p class="text-muted mb-4">Fill in the details below to publish your job listing.</p>

  <form method="POST">
    <div class="card p-4 mb-4">
      <h5 class="fw-700 mb-3">Basic Information</h5>
      <div class="row g-3">
        <div class="col-12">
          <label class="form-label fw-600">Job Title *</label>
          <input type="text" name="title" class="form-control" placeholder="e.g. Senior Backend Developer"
                 value="{{ form.get('title','') }}" required />
        </div>
        <div class="col-12">
          <label class="form-label fw-600">Job Description *</label>
          <textarea name="description" class="form-control" rows="8"
            placeholder="Describe the role, responsibilities, and requirements…" required>{{ form.get('description','') }}</textarea>
        </div>
        <div class="col-md-6">
          <label class="form-label fw-600">Location *</label>
          <input type="text" name="location" class="form-control" placeholder="e.g. Mumbai, India"
                 value="{{ form.get('location','') }}" required />
        </div>
        <div class="col-md-6">
          <label class="form-label fw-600">Category</label>
          <select name="category_id" class="form-select">
            <option value="">Select category</option>
            {% for cat in categories %}
            <option value="{{ cat.id }}">{{ cat.name }}</option>
            {% endfor %}
          </select>
        </div>
      </div>
    </div>

    <div class="card p-4 mb-4">
      <h5 class="fw-700 mb-3">Job Type & Experience</h5>
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label fw-600">Employment Type</label>
          <select name="job_type" class="form-select">
            <option>Full-Time</option>
            <option>Part-Time</option>
            <option>Contract</option>
            <option>Internship</option>
            <option>Freelance</option>
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label fw-600">Experience Level</label>
          <select name="experience_level" class="form-select">
            <option>Entry-Level</option>
            <option selected>Mid-Level</option>
            <option>Senior</option>
            <option>Lead</option>
            <option>Director</option>
          </select>
        </div>
        <div class="col-12">
          <div class="form-check form-switch">
            <input class="form-check-input" type="checkbox" name="is_remote" id="isRemote">
            <label class="form-check-label fw-600" for="isRemote">This is a remote position</label>
          </div>
        </div>
      </div>
    </div>

    <div class="card p-4 mb-4">
      <h5 class="fw-700 mb-3">Compensation & Skills</h5>
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label fw-600">Min Salary (₹/year)</label>
          <input type="number" name="salary_min" class="form-control" placeholder="e.g. 600000" min="0" />
        </div>
        <div class="col-md-6">
          <label class="form-label fw-600">Max Salary (₹/year)</label>
          <input type="number" name="salary_max" class="form-control" placeholder="e.g. 1200000" min="0" />
        </div>
        <div class="col-12">
          <label class="form-label fw-600">Required Skills <small class="text-muted">(comma-separated)</small></label>
          <input type="text" name="skills_required" class="form-control" placeholder="Python, Flask, SQL, …" />
        </div>
        <div class="col-md-6">
          <label class="form-label fw-600">Application Deadline</label>
          <input type="date" name="deadline" class="form-control" />
        </div>
      </div>
    </div>

    <div class="d-flex gap-2">
      <button type="submit" class="btn btn-primary fw-600 px-5"><i class="bi bi-send me-1"></i>Publish Job</button>
      <a href="{{ url_for('employer.dashboard') }}" class="btn btn-outline-secondary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
