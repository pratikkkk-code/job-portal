{% extends "base.html" %}
{% block title %}Create Account – JobConnect{% endblock %}

{% block content %}
<div class="container py-5" style="max-width:520px;">
  <div class="card p-4 p-md-5">
    <div class="text-center mb-4">
      <i class="bi bi-person-plus-fill text-primary" style="font-size:2.5rem;"></i>
      <h2 class="mt-2 fw-800" style="font-family:'Sora',sans-serif;">Create your account</h2>
      <p class="text-muted">Join thousands of professionals on JobConnect</p>
    </div>

    <form method="POST" id="registerForm">
      <!-- Role selection -->
      <div class="mb-4">
        <label class="form-label fw-600">I am a…</label>
        <div class="row g-2">
          <div class="col-6">
            <input type="radio" class="btn-check" name="role" id="seeker" value="seeker" checked>
            <label class="btn btn-outline-primary w-100 py-2" for="seeker">
              <i class="bi bi-person-search d-block fs-4 mb-1"></i>Job Seeker
            </label>
          </div>
          <div class="col-6">
            <input type="radio" class="btn-check" name="role" id="employer" value="employer">
            <label class="btn btn-outline-primary w-100 py-2" for="employer">
              <i class="bi bi-building d-block fs-4 mb-1"></i>Employer
            </label>
          </div>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label fw-600">Full Name</label>
        <input type="text" name="full_name" class="form-control" placeholder="Your full name" value="{{ form.get('full_name','') }}" required />
      </div>

      <!-- Company name (shown only for employers via JS) -->
      <div class="mb-3" id="companyField" style="display:none;">
        <label class="form-label fw-600">Company Name</label>
        <input type="text" name="company_name" class="form-control" placeholder="Your company name" value="{{ form.get('company_name','') }}" />
      </div>

      <div class="mb-3">
        <label class="form-label fw-600">Username</label>
        <input type="text" name="username" class="form-control" placeholder="Choose a username" value="{{ form.get('username','') }}" required />
      </div>

      <div class="mb-3">
        <label class="form-label fw-600">Email Address</label>
        <input type="email" name="email" class="form-control" placeholder="you@example.com" value="{{ form.get('email','') }}" required />
      </div>

      <div class="row g-3 mb-4">
        <div class="col-6">
          <label class="form-label fw-600">Password</label>
          <input type="password" name="password" class="form-control" placeholder="Min 6 chars" required />
        </div>
        <div class="col-6">
          <label class="form-label fw-600">Confirm Password</label>
          <input type="password" name="confirm_password" class="form-control" placeholder="Repeat password" required />
        </div>
      </div>

      <button type="submit" class="btn btn-primary w-100 py-2 fw-600">
        <i class="bi bi-person-plus me-2"></i>Create Account
      </button>
    </form>

    <p class="text-center mt-4 mb-0 text-muted">
      Already have an account? <a href="{{ url_for('auth.login') }}" class="text-primary fw-600">Log in</a>
    </p>
  </div>
</div>

{% block extra_js %}
<script>
  // Show/hide company field based on role
  document.querySelectorAll('input[name="role"]').forEach(r => {
    r.addEventListener('change', () => {
      document.getElementById('companyField').style.display =
        document.querySelector('input[name="role"]:checked').value === 'employer' ? '' : 'none';
    });
  });
</script>
{% endblock %}
{% endblock %}
