{% extends "base.html" %}
{% block title %}Log In – JobConnect{% endblock %}

{% block content %}
<div class="container py-5" style="max-width:460px;">
  <div class="card p-4 p-md-5">
    <div class="text-center mb-4">
      <i class="bi bi-briefcase-fill text-primary" style="font-size:2.5rem;"></i>
      <h2 class="mt-2 fw-800" style="font-family:'Sora',sans-serif;">Welcome back</h2>
      <p class="text-muted">Log in to your JobConnect account</p>
    </div>

    <form method="POST">
      <div class="mb-3">
        <label class="form-label fw-600">Email Address</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-envelope"></i></span>
          <input type="email" name="email" class="form-control" placeholder="you@example.com" required autofocus />
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label fw-600">Password</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-lock"></i></span>
          <input type="password" name="password" class="form-control" placeholder="••••••••" required />
        </div>
      </div>

      <div class="d-flex justify-content-between align-items-center mb-4">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" name="remember" id="remember">
          <label class="form-check-label text-muted" for="remember">Remember me</label>
        </div>
      </div>

      <button type="submit" class="btn btn-primary w-100 py-2 fw-600">
        <i class="bi bi-box-arrow-in-right me-2"></i>Log In
      </button>
    </form>

    <p class="text-center mt-4 mb-0 text-muted">
      Don't have an account? <a href="{{ url_for('auth.register') }}" class="text-primary fw-600">Sign up free</a>
    </p>

    <!-- Demo credentials hint -->
    <div class="mt-4 p-3 rounded-3" style="background:#f0f9ff;border:1px solid #bae6fd;font-size:.82rem;">
      <strong class="text-primary">Demo Credentials:</strong><br>
      Admin: admin@jobportal.com / admin123<br>
      Employer: employer@demo.com / demo123
    </div>
  </div>
</div>
{% endblock %}
